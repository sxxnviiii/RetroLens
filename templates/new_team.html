{% extends "base.html" %}
{% block title %}New Team — RetroLens{% endblock %}
{% block content %}
<div style="max-width: 460px;">
    <h1 class="page-title" style="margin-bottom: 20px;">Create Team</h1>
    <form method="POST" class="card">
        <div class="form-group"><label class="form-label">Team Name</label><input type="text" name="name" class="form-input" required placeholder="e.g., Manzanita Dev Team"></div>
        <button type="submit" class="btn btn-primary">Create Team</button>
    </form>
</div>
{% endblock %}
