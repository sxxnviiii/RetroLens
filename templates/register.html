{% extends "base.html" %}
{% block title %}Register — RetroLens{% endblock %}
{% block content %}
<div style="max-width: 380px; margin: 80px auto;">
    <h1 class="page-title" style="text-align: center; margin-bottom: 28px;">Create Account</h1>
    <form method="POST" class="card">
        <div class="form-group"><label class="form-label">Username</label><input type="text" name="username" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-input" required></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Register</button>
        <p style="text-align: center; margin-top: 14px; font-size: 13px;"><a href="{{ url_for('login') }}" style="color: var(--accent);">Already have an account?</a></p>
    </form>
</div>
{% endblock %}
